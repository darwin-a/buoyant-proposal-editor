services:
  db:
    image: postgres:16-alpine
    container_name: buoyant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: buoyant
      POSTGRES_PASSWORD: buoyant
      POSTGRES_DB: buoyant
    ports:
      - "5434:5432"   # host 5434 → container 5432 (5432/5433 used by other local projects)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buoyant -d buoyant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
